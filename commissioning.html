<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فحص التشغيل والتسليم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="assets/js/holoul-auth.js"></script>
<style>
/* Layout: sticky readiness bar over a single column of collapsible sections; each item is a row with rating chips, a measurement line and a note. Built for a phone held on site. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#14232E; --muted:#5A6B77; --line:#D6DEE4;
  --accent:#0B6E8A; --on-accent:#FFFFFF; --accent-soft:#E0F0F5;
  --ok:#1B7F52; --ok-bg:#E1F3EA; --warn:#935C00; --warn-bg:#FFF0D2; --bad:#B8322A; --bad-bg:#FBE3E0;
  --neutral:#4F606C; --neutral-bg:#E8ECEF;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1920; --surface:#16252E; --ink:#E5EDF2; --muted:#94A7B4; --line:#2A3C47;
  --accent:#55B7D6; --on-accent:#06212B; --accent-soft:#12323D;
  --ok:#4CC38A; --ok-bg:#12372A; --warn:#E8B34E; --warn-bg:#3A2E10; --bad:#F2796D; --bad-bg:#3D1C19;
  --neutral:#A3B4BF; --neutral-bg:#213540; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1920; --surface:#16252E; --ink:#E5EDF2; --muted:#94A7B4; --line:#2A3C47;
  --accent:#55B7D6; --on-accent:#06212B; --accent-soft:#12323D;
  --ok:#4CC38A; --ok-bg:#12372A; --warn:#E8B34E; --warn-bg:#3A2E10; --bad:#F2796D; --bad-bg:#3D1C19;
  --neutral:#A3B4BF; --neutral-bg:#213540; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-block:0 48px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
.proto{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:22px;font-weight:700;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h2{font-size:15px;font-weight:700;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.f .src{font-size:11px;color:var(--accent)}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;color:var(--ink)}
textarea{resize:vertical;min-height:40px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ro{background:var(--neutral-bg);border-radius:8px;padding:8px 10px;min-height:40px;color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.mono{font-family:var(--mono)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
/* readiness bar */
.ready{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ready .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:8px;background:var(--neutral-bg);border-radius:6px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;background:var(--neutral-bg);color:var(--neutral)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.blockers{margin:0;padding:0 18px 0 0;font-size:13px;color:var(--muted)}
.blockers li{margin:1px 0}
/* sections */
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .letter{width:28px;height:28px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--mono);font-size:14px}
details.sec>summary .ttl{flex:1;min-width:0}
details.sec>summary .cnt{font-weight:500;font-size:12.5px;color:var(--muted)}
details.sec>summary::after{content:"‹";transition:transform .15s;color:var(--muted);font-size:18px}
details.sec[open]>summary::after{transform:rotate(-90deg)}
.items{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);border-inline-start:4px solid transparent}
.item:last-child{border-bottom:0}
.item[data-st=ex],.item[data-st=gd]{border-inline-start-color:var(--ok)}
.item[data-st=ac]{border-inline-start-color:var(--warn)}
.item[data-st=po]{border-inline-start-color:var(--bad)}
.item[data-st=sk]{border-inline-start-color:var(--neutral)}
.ih{display:flex;gap:10px;align-items:flex-start}
.code{font-family:var(--mono);font-size:12px;background:var(--neutral-bg);color:var(--neutral);border-radius:5px;padding:2px 6px;flex:none;margin-top:3px}
.t{font-weight:600}
.crit{color:var(--muted);font-size:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:11.5px;border-radius:5px;padding:1px 7px;background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;min-height:38px;cursor:pointer;font-size:13.5px}
.chips button[aria-checked=true]{font-weight:700}
.chips button[data-r=ex][aria-checked=true]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.chips button[data-r=gd][aria-checked=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chips button[data-r=ac][aria-checked=true]{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.chips button[data-r=po][aria-checked=true]{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.chips button[data-r=sk][aria-checked=true]{background:var(--neutral-bg);color:var(--neutral);border-color:var(--neutral);border-style:dashed}
.chips button[data-r=na][aria-checked=true]{background:var(--neutral-bg);color:var(--neutral);border-color:var(--neutral)}
.meas{display:grid;grid-template-columns:minmax(90px,1fr) minmax(90px,1fr) auto;gap:8px;align-items:end}
.meas .u{padding-bottom:10px;color:var(--muted);font-size:13px;font-family:var(--mono)}
.meas label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.xtra{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.xtra textarea{flex:1;min-width:180px}
.photo-btn{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px;color:var(--muted);font-size:13px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs div{position:relative}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;inset-inline-start:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;font-size:12px;line-height:20px;padding:0}
.hint{font-size:12.5px;border-radius:6px;padding:4px 9px}
.hint.info{background:var(--accent-soft);color:var(--accent)}
.stop{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:13.5px}
.stop ul{margin:4px 0 0;padding:0 18px 0 0}
.hint.warn{background:var(--warn-bg);color:var(--warn)} .hint.bad{background:var(--bad-bg);color:var(--bad)}
/* tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:460px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12.5px}
td input{min-height:36px;padding:5px 8px}
.num{font-variant-numeric:tabular-nums}
.rec{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .rt{font-weight:600}
.rec .ro2{grid-column:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.rec input[type=checkbox]{width:20px;height:20px;margin-top:3px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;min-height:42px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
canvas.sig{width:100%;height:130px;background:var(--bg);border:1px dashed var(--muted);border-radius:8px;touch-action:none;display:block}
.ack{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.done{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:12px 14px;font-weight:600}
.empty{padding:14px;color:var(--muted);font-size:14px}
/* structured component forms */
.comp{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.comp:last-child{border-bottom:0}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ch .code{margin:0}
.ch h3{font-size:15px;font-weight:700;flex:1;min-width:140px}
.ref{font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 9px}
.av{display:flex;gap:6px;flex-wrap:wrap}
.av button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 16px;min-height:40px;cursor:pointer}
.av button[aria-pressed=true][data-v=yes]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok);font-weight:700}
.av button[aria-pressed=true][data-v=no]{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);font-weight:700}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>.lb{font-size:13px;color:var(--muted)}
.fld>.lb b{color:var(--bad)}
.inl{display:flex;align-items:center;gap:8px}
.fld .inl input{max-width:240px}
.inl .u{color:var(--muted);font-size:13px;font-family:var(--mono);white-space:nowrap}
.opt{display:flex;gap:6px;flex-wrap:wrap}
.opt button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;min-height:40px;cursor:pointer;font-size:14px}
.opt button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
.rrow{display:grid;grid-template-columns:auto repeat(auto-fit,minmax(110px,1fr));gap:8px;align-items:end;padding:8px;background:var(--bg);border-radius:8px;margin-top:6px}
.rrow .rl{font-size:13px;font-weight:600;padding-bottom:10px;white-space:nowrap}
.rrow .rc{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:12px;color:var(--muted)}
.rrow .opt button{padding:5px 10px;min-height:38px}
.cstate{font-size:12px;border-radius:999px;padding:2px 10px;font-weight:600}
.cstate[data-s=done]{background:var(--ok-bg);color:var(--ok)}
.cstate[data-s=part]{background:var(--warn-bg);color:var(--warn)}
.cstate[data-s=empty]{background:var(--neutral-bg);color:var(--neutral)}
.chk{display:flex;flex-direction:column}
.chkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.chkrow:last-child{border-bottom:0}
.chkrow span{flex:1;min-width:180px}
.hints{display:flex;flex-direction:column;gap:5px}
@media (max-width:480px){.meas{grid-template-columns:1fr 1fr}.meas .u{grid-column:1/-1;padding:0}}
.locked #sections,.locked #recs,.locked .ack+.grid,.locked .sigs,.locked #approve{pointer-events:none;opacity:.65}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:50;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <div>
      <h1>فحص التشغيل والتسليم</h1>
      <p class="sub" id="reportTypeLine"></p>
    </div>
    <span class="pill mono" id="reportNo"></span>
  </header>

  <section class="card" aria-labelledby="h-proj">
    <h2 id="h-proj">حالة الفحص</h2>
    <div id="wf"></div>
  </section>

  <section class="card" aria-labelledby="h-info">
    <h2 id="h-info">1. معلومات العميل والنظام</h2>
    <div class="grid" id="infoGrid"></div>
  </section>

  <section class="card" aria-labelledby="h-rep">
    <h2 id="h-rep">2. تفاصيل التقرير</h2>
    <div class="grid">
      <label class="f">تاريخ الفحص<input type="date" id="rdate"></label>
      <label class="f">اسم المهندس<input type="text" id="eng" placeholder="اسم المهندس المسؤول"></label>
      <div class="f">نوع التقرير<div class="ro" id="rtype"></div></div>
    </div>
  </section>

  <div class="ready" id="ready" aria-live="polite"></div>

  <div id="sections" class="wrap" style="gap:10px"></div>

  <section class="card" aria-labelledby="h-rec">
    <h2 id="h-rec">3. ملاحظات وتوصيات</h2>
    <p class="crit" style="margin-bottom:6px">أي بند مقيَّم «مقبول» أو «ضعيف» وعليه ملاحظة يدخل هنا تلقائيًا، وهذه هي قائمة الملاحظات المتبقية في التسليم.</p>
    <div id="recs"></div>
    <div class="xtra" style="margin-top:10px">
      <input type="text" id="recNew" placeholder="أضف توصية يدوية" style="flex:1;min-width:200px">
      <button class="btn ghost" id="recAdd" type="button">إضافة</button>
    </div>
  </section>

  <section class="card" aria-labelledby="h-ack">
    <h2 id="h-ack">4. إقرار العميل وتوقيع المهندس</h2>
    <div class="ack" id="ackText"></div>
    <div class="grid" style="margin-bottom:12px">
      <label class="f">اسم العميل<input type="text" id="cname"></label>
      <label class="f">تاريخ توقيع العميل<input type="date" id="cdate"></label>
    </div>
    <div class="sigs">
      <div class="f">توقيع العميل<canvas class="sig" id="sigC" aria-label="مساحة توقيع العميل"></canvas>
        <button class="btn ghost" type="button" data-clear="sigC" style="margin-top:6px;align-self:flex-start">مسح</button></div>
      <div class="f">توقيع المهندس<canvas class="sig" id="sigE" aria-label="مساحة توقيع المهندس"></canvas>
        <button class="btn ghost" type="button" data-clear="sigE" style="margin-top:6px;align-self:flex-start">مسح</button></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn" id="approve" type="button">توقيع وإرسال للاعتماد</button>
    </div>
    <div id="approved" style="margin-top:12px"></div>
  </section>
</div>

<script>
/* ---------- data ---------- */
let PROJECTS=[];
const SCOPES=[['supply','توريد فقط'],['installation','تركيب فقط'],['lumpsum','توريد وتركيب (مقطوعية)']];
const SYSTEMS=[['pump','مضخة'],['ongrid','أون-جريد'],['offgrid','أوف-جريد'],['hybrid','هايبرد']];
const SYSN=Object.fromEntries(SYSTEMS);
const RATES=[['ex','ممتاز'],['gd','جيد'],['ac','مقبول'],['po','ضعيف'],['sk','لم يُفحص'],['na','لا ينطبق']];
const RN=Object.fromEntries(RATES);
const P='pump';
// [id, text, criterion, supply, install, systems|null, measure|null, optional]

const GEN=[];

/* ---------- structured component forms ---------- */
const YN=[['yes','نعم'],['no','لا']];
const OKBAD=[['ok','سليمة'],['bad','غير سليمة']];
const hasBad=c=>Array.isArray(c)&&c.some(x=>x!=='ok');
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:null};
const FORMS=[
{L:'A',T:'استلام المواد والفحص',intro:'فنّط المواد بالترتيب. لكل مكوّن اختر متاح أو غير متاح، ثم سجّل حالته وبياناته.',comps:[
 {id:'A1',title:'الألواح الشمسية',av:['متاحة','غير متاحة'],ref:p=>p.panel&&('المطلوب في العرض: '+p.panel),fields:[
  {k:'total',t:'num',label:'عدد الألواح المستلمة',u:'لوح',req:1},
  {k:'cond',t:'multi',label:'الحالة الظاهرية',opts:[['ok','سليمة بالكامل',1],['dent','انبعاج في الهيكل'],['glass','كسر في الزجاج']],req:1},
  {k:'bad',t:'num',label:'عدد الألواح التي بها مشاكل',u:'لوح',req:1,showIf:d=>hasBad(d.cond)},
  {k:'ser',t:'area',label:'سيريال نمبر الألواح (اختياري، خصوصًا المتضررة)',wide:1},
  {k:'match',t:'radio',label:'بيانات الألواح مطابقة للموديل المطلوب',opts:YN,req:1},
  {k:'actual',t:'text',label:'الموديل والقدرة الفعليان',req:1,showIf:d=>d.match==='no'},
  {k:'note',t:'area',label:'ملاحظات',wide:1}],
  hints:d=>{const h=[];if(num(d.total)!=null&&num(d.bad)>num(d.total))h.push('عدد الألواح المتضررة أكبر من عدد الألواح المستلمة.');return h},
  recs:d=>{const r=[],L={dent:'انبعاج في الهيكل',glass:'كسر في الزجاج'};
    if(hasBad(d.cond))r.push(`${d.bad||'؟'} لوح متضرر (${d.cond.filter(x=>x!=='ok').map(x=>L[x]).join(' + ')})`);
    if(d.match==='no')r.push(`غير مطابقة للموديل المطلوب، الفعلي: ${d.actual||'—'}`);return r}},
 {id:'A2',title:'الانفرتر',av:['متاح','غير متاح'],ref:p=>p.inv&&('المطلوب في العرض: '+p.inv),fields:[
  {k:'cond',t:'radio',label:'الحالة الظاهرية',opts:[['ok','سليم بدون أي خدوش'],['scr','به خدوش'],['other','أخرى']],req:1,wide:1},
  {k:'condNote',t:'area',label:'ملاحظة بحالة الجهاز',wide:1,showIf:d=>d.cond==='scr'||d.cond==='other',req:d=>d.cond==='other'},
  {k:'cap',t:'num',label:'قدرة الانفرتر الفعلية',u:'kW',req:1},

function sigSetup(){
  [['sigC','sigC'],['sigE','sigE']].forEach(([cid,key])=>{
    const c=document.getElementById(cid),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;
    const w=c.clientWidth||300,h=c.clientHeight||130;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);
    ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';
    const ink=getComputedStyle(document.body).color;ctx.strokeStyle=ink;
    const saved=S()[key];if(saved){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,w,h);im.src=saved}
    let down=false;
    const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke()};
    c.onpointermove=e=>{if(!down)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()};
    const up=()=>{if(!down)return;down=false;S()[key]=c.toDataURL('image/png');S().ok=false;save();refresh()};
    c.onpointerup=up;c.onpointercancel=up;
  });
}
