name: Verify live site after deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      # GitHub Pages can take anywhere from a few seconds to a couple of
      # minutes to publish after a push. A fixed sleep was flaky (it fired
      # before Pages had actually updated). Poll instead: retry every 10s
      # for up to 3 minutes, and only fail if it never comes up healthy.
      - name: Wait for homepage to respond with 200
        run: |
          set -euo pipefail
          URL="https://alhussieni.github.io/HoloulEnergyKSA-QL/index.html"
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Homepage is up."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Homepage never returned 200 after 3 minutes."
          exit 1

      - name: Check page actually contains expected content
        run: |
          set -euo pipefail
          URL="https://alhussieni.github.io/HoloulEnergyKSA-QL/index.html"
          if ! curl -s "$URL" | grep -q "HoloulEnergy"; then
            echo "::error::Homepage did not contain expected content — possible broken deploy."
            exit 1
          fi
          echo "Homepage content check passed."
