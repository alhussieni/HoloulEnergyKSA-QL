name: Daily database backup

# Runs every day at 02:00 Riyadh time (23:00 UTC the day before) and can also
# be triggered manually from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # The distro's older postgresql-client is often already present
          # and its /usr/bin/pg_dump can still shadow the v17 one, so call
          # the versioned binary by its full path everywhere below rather
          # than relying on whatever "pg_dump" resolves to on PATH.
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Checkout backups branch
        uses: actions/checkout@v4
        with:
          ref: backups
          fetch-depth: 1

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. See README-BACKUPS.md."
            exit 1
          fi
          mkdir -p backups debug
          STAMP=$(date -u +"%Y-%m-%d_%H%M")
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges --schema=public \
            -f "backups/${STAMP}.sql" > debug/last-dump-attempt.txt 2>&1
          DUMP_EXIT=$?
          echo "pg_dump exit code: $DUMP_EXIT" >> debug/last-dump-attempt.txt
          cat debug/last-dump-attempt.txt
          if [ $DUMP_EXIT -ne 0 ]; then
            exit 1
          fi
          gzip "backups/${STAMP}.sql"

      - name: Commit debug output on failure
        if: failure()
        run: |
          git config user.name "backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add debug/
          git commit -m "debug: dump attempt output $(date -u +'%Y-%m-%d_%H%M')" || echo "nothing to commit"
          git push origin backups

      - name: Commit and push backup
        run: |
          git config user.name "backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(backup): daily database snapshot $(date -u +"%Y-%m-%d")"
            git push origin backups
          fi

      - name: Prune backups older than 90 days
        run: |
          find backups -name "*.sql.gz" -mtime +90 -print -delete || true
          git config user.name "backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/
          if ! git diff --cached --quiet; then
            git commit -m "chore(backup): prune snapshots older than 90 days"
            git push origin backups
          fi
