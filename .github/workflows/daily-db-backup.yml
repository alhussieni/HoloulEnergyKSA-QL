name: Daily database backup

# Runs every day at 02:00 Riyadh time (23:00 UTC the day before) and can also
# be triggered manually from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Checkout backups branch
        uses: actions/checkout@v4
        with:
          ref: backups
          fetch-depth: 1

      # TEMPORARY DEBUG STEP — safe to remove once the connection issue is
      # resolved. Never echoes the password: only the parsed host/user/port
      # (from the URL structure, not the DB), and psql's own connection
      # result, which by design never includes the password either. Result
      # is committed to this branch so it can be inspected without needing
      # GitHub's log viewer.
      - name: Debug connection (redacted)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          mkdir -p debug
          {
            echo "=== $(date -u) ==="
            echo "Secret SUPABASE_DB_URL is set: $([ -n "$SUPABASE_DB_URL" ] && echo yes || echo no)"
            echo "Secret length (chars): ${#SUPABASE_DB_URL}"
            echo ""
            echo "--- Parsed URL structure (password redacted) ---"
            python3 -c "
import os, re
url = os.environ.get('SUPABASE_DB_URL', '')
m = re.match(r'^(postgresql|postgres)://([^:]+):([^@]*)@([^:/]+):(\d+)/(.+)$', url)
if not m:
    print('URL did NOT match the expected postgresql://user:pass@host:port/db pattern.')
    print('First 15 chars:', repr(url[:15]))
    print('Last 15 chars:', repr(url[-15:]))
else:
    scheme, user, pw, host, port, db = m.groups()
    print('scheme:', scheme)
    print('user:', repr(user))
    print('password length:', len(pw))
    print('password has literal @ (would break parsing):', '@' in pw)
    print('password has literal : (would break parsing):', ':' in pw)
    print('password starts/ends with whitespace:', pw != pw.strip())
    print('host:', repr(host))
    print('port:', repr(port))
    print('db:', repr(db))
    print('db has trailing whitespace/newline:', db != db.strip())
"
            echo ""
            echo "--- psql connection test (SELECT current_user, current_database()) ---"
            psql "$SUPABASE_DB_URL" -c "select current_user, current_database(), version();" 2>&1
            echo ""
            echo "exit code: $?"
          } > debug/connection-test-result.txt 2>&1
          cat debug/connection-test-result.txt

      - name: Commit debug result
        if: always()
        run: |
          git config user.name "backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add debug/
          git commit -m "debug: connection test result $(date -u +"%Y-%m-%d_%H%M")" || echo "nothing to commit"
          git push origin backups

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. See README-BACKUPS.md."
            exit 1
          fi
          mkdir -p backups
          STAMP=$(date -u +"%Y-%m-%d_%H%M")
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges --schema=public \
            -f "backups/${STAMP}.sql"
          gzip "backups/${STAMP}.sql"

      - name: Commit and push backup
        run: |
          git config user.name "backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(backup): daily database snapshot $(date -u +"%Y-%m-%d")"
            git push origin backups
          fi

      - name: Prune backups older than 90 days
        run: |
          find backups -name "*.sql.gz" -mtime +90 -print -delete || true
          git config user.name "backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/
          if ! git diff --cached --quiet; then
            git commit -m "chore(backup): prune snapshots older than 90 days"
            git push origin backups
          fi
