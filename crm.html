<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة العملاء · HoloulEnergy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1713; --surface:#161f1a; --surface2:#1c2820;
  --border:#2a362f; --text:#eef2ee; --muted:#93a89c; --muted2:#6c7d72;
  --gold:#e8a33d; --gold-dim:#4a3a1e; --teal:#2bb673; --teal-dim:#123324;
  --red:#e0553f; --red-dim:#3a1f1a; --blue:#5b8ef2; --amber:#f0c14b;
  --radius:12px; --radius-sm:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(232,163,61,.10), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.disp{font-family:'Cairo',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button,input,select,textarea{font-family:inherit;}
a{color:var(--gold);}
::selection{background:var(--gold);color:#1a1204;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* ---------- login ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.loginCard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.loginCard .sun{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #ffd98a, var(--gold) 60%, #a86e1c 100%);box-shadow:0 0 30px rgba(232,163,61,.5);margin-bottom:14px;}
.loginCard h1{font-size:20px;margin:0 0 4px;}
.loginCard p{color:var(--muted);font-size:13.5px;margin:0 0 18px;}
.roleTabs{display:flex;gap:6px;margin-bottom:18px;background:var(--surface2);border-radius:var(--radius-sm);padding:4px;}
.roleTab{flex:1;text-align:center;padding:8px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);}
.roleTab.active{background:var(--gold);color:#1a1204;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:10px 12px;font-size:14.5px;}
.field textarea{resize:vertical;min-height:70px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--gold);color:#1a1204;border:none;border-radius:var(--radius-sm);padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .12s,filter .12s;}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(.98);}
.btn.block{width:100%;}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold);}
.btn.sm{padding:6px 12px;font-size:12.5px;}
.errMsg{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;}

/* ---------- app shell ---------- */
#app{display:none;}
header.top{position:sticky;top:0;z-index:20;background:rgba(15,23,19,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .sun{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #ffd98a, var(--gold) 60%, #a86e1c 100%);}
.brand b{font-family:'Cairo',sans-serif;font-size:15.5px;}
.brand span{color:var(--muted);font-size:12px;}
.tabs{display:flex;gap:6px;}
.tab{padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--muted);border:1px solid transparent;}
.tab.active{background:var(--surface2);color:var(--gold);border-color:var(--border);}
.userChip{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;}
main{padding:20px;max-width:1180px;margin:0 auto;}

/* ---------- dashboard ---------- */
.kpiGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;}
.kpi:before{content:"";position:absolute;inset:0;background:radial-gradient(120px 80px at 90% -10%, rgba(232,163,61,.12), transparent);}
.kpi .n{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;position:relative;}
.kpi .l{color:var(--muted);font-size:12.5px;margin-top:4px;position:relative;}
.kpi.gold .n{color:var(--gold);}
.kpi.teal .n{color:var(--teal);}
.kpi.red .n{color:var(--red);}
.panels{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;}
@media(max-width:860px){.panels{grid-template-columns:1fr;}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.panel h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;justify-content:space-between;}
.barRow{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;}
.barRow .lbl{width:130px;flex:none;color:var(--muted);}
.barRow .track{flex:1;height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;}
.barRow .fill{height:100%;background:linear-gradient(90deg,var(--gold),#c97f22);}
.barRow .val{width:34px;text-align:left;font-family:'IBM Plex Mono',monospace;color:var(--muted);flex:none;}
.followRow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;cursor:pointer;}
.followRow:last-child{border-bottom:none;}
.followRow:hover{color:var(--gold);}
.followRow .d{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px;}
.emptyNote{color:var(--muted2);font-size:13px;padding:6px 0;}

/* ---------- customers ---------- */
.filterBar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filterBar input,.filterBar select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:9px 12px;font-size:13.5px;}
.filterBar input[type=text]{flex:1;min-width:180px;}
table.list{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
table.list th{text-align:right;font-size:12px;color:var(--muted);padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--border);}
table.list td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13.5px;}
table.list tr:last-child td{border-bottom:none;}
table.list tbody tr{cursor:pointer;}
table.list tbody tr:hover{background:var(--surface2);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;}
.od{color:var(--red);font-weight:700;}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,10,8,.65);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:50;overflow:auto;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:760px;padding:22px;margin-top:10px;}
.modal .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.modal .head h2{margin:0;font-size:18px;}
.modal .head .phone{color:var(--muted);font-size:13px;font-family:'IBM Plex Mono',monospace;}
.closeX{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.grid2{grid-template-columns:1fr;}}
.section{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
.section h4{margin:0 0 10px;font-size:13.5px;color:var(--gold);}
.quoteRow,.intRow{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;font-size:13px;}
.quoteRow .top,.intRow .top{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;margin-bottom:4px;}
.intRow .note{color:var(--text);}
.saveBar{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.hidden{display:none !important;}
.loadingNote{color:var(--muted);font-size:13px;padding:20px;text-align:center;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="loginCard">
    <div class="sun"></div>
    <h1>متابعة العملاء (CRM)</h1>
    <p>HoloulEnergy · سجّل دخولك بنفس بيانات لوحة التحكم</p>
    <div class="roleTabs">
      <div class="roleTab active" data-role="rep">دخول كمندوب</div>
      <div class="roleTab" data-role="admin">دخول كأدمن</div>
    </div>
    <form id="loginForm">
      <div class="field" id="userField">
        <label>اسم المستخدم</label>
        <input type="text" id="loginUser" autocomplete="username">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="loginPass" autocomplete="current-password" required>
      </div>
      <button class="btn block" type="submit">دخول</button>
      <div class="errMsg" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="sun"></div>
      <div><b>متابعة العملاء</b><br><span>HoloulEnergy</span></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="dashboard">لوحة المتابعة</div>
      <div class="tab" data-tab="customers">العملاء</div>
    </div>
    <div class="userChip">
      <span id="repNameChip"></span>
      <button class="btn ghost sm" id="logoutBtn">خروج</button>
    </div>
  </header>

  <main>
    <section id="view-dashboard">
      <div class="kpiGrid" id="kpiGrid"></div>
      <div class="panels">
        <div>
          <div class="panel"><h3>أسباب توقف التنفيذ (البلوكرز)</h3><div id="blockerBars"><div class="loadingNote">بيحمّل...</div></div></div>
          <div class="panel"><h3>رأي العملاء في السعر</h3><div id="priceBars"><div class="loadingNote">بيحمّل...</div></div></div>
        </div>
        <div>
          <div class="panel"><h3>متابعات متأخرة <span class="badge" style="background:var(--red-dim);color:var(--red)" id="overdueCount">0</span></h3><div id="overdueList"></div></div>
          <div class="panel"><h3>متابعات النهاردة <span class="badge" style="background:var(--gold-dim);color:var(--gold)" id="todayCount">0</span></h3><div id="todayList"></div></div>
        </div>
      </div>
    </section>

    <section id="view-customers" class="hidden">
      <div class="filterBar">
        <input type="text" id="searchInput" placeholder="دور بالاسم أو رقم الهاتف...">
        <select id="statusFilter"><option value="">كل الحالات</option></select>
        <select id="followFilter">
          <option value="">كل المواعيد</option>
          <option value="overdue">متأخر عليهم</option>
          <option value="today">مطلوب متابعة النهاردة</option>
        </select>
        <button class="btn" id="newLeadBtn">+ عميل جديد</button>
      </div>
      <div id="customersTableWrap"><div class="loadingNote">بيحمّل العملاء...</div></div>
    </section>
  </main>
</div>

<div class="overlay" id="custOverlay"><div class="modal" id="custModal"></div></div>

<div class="overlay" id="newOverlay">
  <div class="modal" style="max-width:420px;">
    <div class="head"><h2>إضافة عميل جديد</h2><button class="closeX" data-close-new>×</button></div>
    <div class="field"><label>الاسم</label><input type="text" id="newName"></div>
    <div class="field"><label>رقم الهاتف / واتساب</label><input type="text" id="newPhone" required></div>
    <div class="field"><label>المدينة</label><input type="text" id="newCity"></div>
    <div class="field"><label>المندوب المسؤول</label><input type="text" id="newRep"></div>
    <div class="errMsg" id="newErr"></div>
    <div class="saveBar"><button class="btn" id="newSaveBtn">حفظ</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG (same project as index.html) ============ */
const SUPABASE_URL = 'https://xhgwvszdatqlvlgqiikj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4qWmgl6fWMpoU6F_o__ykg_Z0Xy_aJY';
const ENGINE_FN = SUPABASE_URL + '/functions/v1/compute-quote'; // login only
const CRM_FN = SUPABASE_URL + '/functions/v1/crm-api';          // everything else

const STATUS_META = {
  new:{label:"عميل جديد",color:"#5b8ef2",dim:"#1a2436"},
  contacted:{label:"تم التواصل",color:"#f0c14b",dim:"#3a3016"},
  negotiating:{label:"بيتفاوض",color:"#e8a33d",dim:"#4a3a1e"},
  won:{label:"اتنفذ",color:"#2bb673",dim:"#123324"},
  lost:{label:"اتفقد",color:"#e0553f",dim:"#3a1f1a"},
  on_hold:{label:"مؤجل",color:"#93a89c",dim:"#26302b"},
};
const BLOCKER_META = {
  price_too_high:"السعر غالي", no_budget:"مفيش ميزانية دلوقتي",
  comparing_offers:"بيقارن بعروض تانية", technical_concerns:"مخاوف فنية",
  trust_company:"مش متأكد من الشركة", timing_not_ready:"مش وقته دلوقتي",
  no_response:"مبيردش / اختفى", changed_mind:"غيّر رأيه",
  other:"سبب تاني", none:"مفيش مشكلة",
};
const PRICE_META = { acceptable:"السعر مناسب", slightly_high:"غالي شوية", too_high:"غالي جدًا", needs_discount:"محتاج خصم", unknown:"مش معروف" };
const PRIORITY_META = { hot:"🔥 ساخن", warm:"دافئ", cold:"بارد" };
const INTERACTION_META = { call:"مكالمة", whatsapp:"واتساب", visit:"زيارة", meeting:"اجتماع", other:"تانى" };

/* ============ STATE ============ */
let SESSION = null; // { role: 'rep'|'admin', token, displayName }
let loginRole = 'rep';

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
function fmtMoney(v){ if(v==null) return "-"; return Number(v).toLocaleString('ar-EG',{maximumFractionDigits:0}); }
function fmtDate(v){ if(!v) return "-"; return v.slice(0,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

async function crmApi(action, payload={}){
  const authField = SESSION.role === 'admin' ? {adminToken: SESSION.token} : {token: SESSION.token};
  const res = await fetch(CRM_FN, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+SUPABASE_ANON_KEY, "apikey":SUPABASE_ANON_KEY },
    body: JSON.stringify(Object.assign({action}, authField, payload))
  });
  let data;
  try{ data = await res.json(); } catch(e){ throw new Error("رد غير متوقع من السيرفر"); }
  if(data.error){ throw new Error(data.error); }
  return data;
}

/* ============ LOGIN ============ */
document.querySelectorAll('.roleTab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.roleTab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    loginRole = t.dataset.role;
    document.getElementById('userField').style.display = loginRole==='admin' ? 'none' : 'block';
    document.getElementById('loginUser').required = loginRole !== 'admin';
  });
});

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const errEl = document.getElementById('loginErr');
  errEl.textContent = "";
  const password = document.getElementById('loginPass').value;
  try{
    let body;
    if(loginRole === 'admin'){
      body = { action:'admin-login', adminPassword: password };
    } else {
      const username = document.getElementById('loginUser').value.trim();
      body = { action:'rep-login', username, password };
    }
    const res = await fetch(ENGINE_FN, {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+SUPABASE_ANON_KEY,"apikey":SUPABASE_ANON_KEY},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(data.error || !data.token){ errEl.textContent = loginRole==='admin' ? "كلمة السر غير صحيحة" : "بيانات الدخول غير صحيحة"; return; }
    SESSION = { role: loginRole, token: data.token, displayName: loginRole==='admin' ? 'الأدمن' : data.displayName };
    sessionStorage.setItem('holoul_crm_session', JSON.stringify(SESSION));
    enterApp();
  }catch(err){
    errEl.textContent = "مشكلة في الاتصال، حاول تاني";
  }
});

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  sessionStorage.removeItem('holoul_crm_session');
  location.reload();
});

function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('repNameChip').textContent = SESSION.displayName;
  Object.keys(STATUS_META).forEach(k=>{
    const o=document.createElement('option'); o.value=k; o.textContent=STATUS_META[k].label;
    document.getElementById('statusFilter').appendChild(o);
  });
  loadDashboard();
  loadCustomers();
}

(function tryRestoreSession(){
  const saved = sessionStorage.getItem('holoul_crm_session');
  if(saved){ SESSION = JSON.parse(saved); enterApp(); }
})();

/* ============ TABS ============ */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const tab = t.dataset.tab;
    document.getElementById('view-dashboard').classList.toggle('hidden', tab!=='dashboard');
    document.getElementById('view-customers').classList.toggle('hidden', tab!=='customers');
    if(tab==='dashboard') loadDashboard();
    if(tab==='customers') loadCustomers();
  });
});

/* ============ DASHBOARD ============ */
async function loadDashboard(){
  try{
    const d = await crmApi('admin-crm-stats');
    const sc = d.statusCounts || {};
    document.getElementById('kpiGrid').innerHTML = `
      <div class="kpi gold"><div class="n mono">${d.totalLeads}</div><div class="l">إجمالي العملاء المسجلين</div></div>
      <div class="kpi"><div class="n mono">${sc.negotiating||0}</div><div class="l">بيتفاوض دلوقتي</div></div>
      <div class="kpi teal"><div class="n mono">${sc.won||0}</div><div class="l">اتنفذوا (Won)</div></div>
      <div class="kpi red"><div class="n mono">${sc.lost||0}</div><div class="l">اتفقدوا (Lost)</div></div>
      <div class="kpi gold"><div class="n mono">${d.conversionRate.toFixed(1)}%</div><div class="l">معدل التحويل</div></div>
      <div class="kpi"><div class="n mono">${fmtMoney(d.avgWonValue)}</div><div class="l">متوسط سعر العروض الناجحة</div></div>
      <div class="kpi"><div class="n mono">${fmtMoney(d.avgLostValue)}</div><div class="l">متوسط سعر العروض المفقودة</div></div>
    `;
    renderBars('blockerBars', d.blockerCounts, BLOCKER_META);
    renderBars('priceBars', d.priceFeedbackCounts, PRICE_META);
    document.getElementById('overdueCount').textContent = d.overdueFollowUps;
    document.getElementById('todayCount').textContent = d.dueToday;
    const [ov, td] = await Promise.all([
      crmApi('admin-crm-list-customers', {followUpDue:'overdue'}),
      crmApi('admin-crm-list-customers', {followUpDue:'today'})
    ]);
    renderFollowList('overdueList', ov.customers.filter(c=>c.status!=='won'&&c.status!=='lost'));
    renderFollowList('todayList', td.customers);
  }catch(err){ toast('تعذر تحميل لوحة المتابعة: '+err.message); }
}
function renderBars(elId, counts, meta){
  const el = document.getElementById(elId);
  const entries = Object.entries(counts||{}).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){ el.innerHTML = '<div class="emptyNote">لسه مفيش بيانات كفاية</div>'; return; }
  const max = Math.max(...entries.map(e=>e[1]));
  el.innerHTML = entries.map(([k,v])=>`
    <div class="barRow"><div class="lbl">${meta[k]||k}</div><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(0)}%"></div></div><div class="val mono">${v}</div></div>`).join('');
}
function renderFollowList(elId, list){
  const el = document.getElementById(elId);
  if(!list.length){ el.innerHTML = '<div class="emptyNote">مفيش متابعات هنا 👍</div>'; return; }
  el.innerHTML = list.slice(0,8).map(c=>`<div class="followRow" data-id="${c.id}"><span>${c.name||'بدون اسم'} · ${c.phone}</span><span class="d">${fmtDate(c.next_follow_up_date)}</span></div>`).join('');
  el.querySelectorAll('.followRow').forEach(r=>r.addEventListener('click', ()=>openCustomer(r.dataset.id)));
}

/* ============ CUSTOMERS LIST ============ */
let searchDebounce;
document.getElementById('searchInput').addEventListener('input', ()=>{ clearTimeout(searchDebounce); searchDebounce=setTimeout(loadCustomers, 350); });
document.getElementById('statusFilter').addEventListener('change', loadCustomers);
document.getElementById('followFilter').addEventListener('change', loadCustomers);

async function loadCustomers(){
  const wrap = document.getElementById('customersTableWrap');
  wrap.innerHTML = '<div class="loadingNote">بيحمّل العملاء...</div>';
  try{
    const params = {
      search: document.getElementById('searchInput').value.trim(),
      status: document.getElementById('statusFilter').value,
      followUpDue: document.getElementById('followFilter').value,
    };
    const d = await crmApi('admin-crm-list-customers', params);
    if(!d.customers.length){ wrap.innerHTML = '<div class="loadingNote">مفيش عملاء مطابقين</div>'; return; }
    const today = todayStr();
    wrap.innerHTML = `<table class="list"><thead><tr>
      <th>العميل</th><th>الهاتف</th><th>الحالة</th><th>الأولوية</th><th>رأيه في السعر</th><th>المشكلة</th><th>متابعة قادمة</th>
      </tr></thead><tbody>
      ${d.customers.map(c=>{
        const sm = STATUS_META[c.status]||{label:c.status,color:'#93a89c',dim:'#222'};
        const overdue = c.next_follow_up_date && c.next_follow_up_date < today && c.status!=='won' && c.status!=='lost';
        return `<tr data-id="${c.id}">
          <td>${c.name||'<span style="color:var(--muted)">بدون اسم</span>'}</td>
          <td class="mono">${c.phone}</td>
          <td><span class="badge" style="background:${sm.dim};color:${sm.color}">${sm.label}</span></td>
          <td>${PRIORITY_META[c.priority]||'-'}</td>
          <td>${c.price_feedback ? (PRICE_META[c.price_feedback]||c.price_feedback) : '-'}</td>
          <td>${c.blocker_reason ? (BLOCKER_META[c.blocker_reason]||c.blocker_reason) : '-'}</td>
          <td class="${overdue?'od':''} mono">${fmtDate(c.next_follow_up_date)}${overdue?' ⚠':''}</td>
        </tr>`;
      }).join('')}
      </tbody></table>`;
    wrap.querySelectorAll('tbody tr').forEach(r=>r.addEventListener('click', ()=>openCustomer(r.dataset.id)));
  }catch(err){ wrap.innerHTML = '<div class="loadingNote">تعذر التحميل: '+err.message+'</div>'; }
}

/* ============ CUSTOMER MODAL ============ */
const custOverlay = document.getElementById('custOverlay');
custOverlay.addEventListener('click', (e)=>{ if(e.target===custOverlay) closeCustomer(); });
function closeCustomer(){ custOverlay.classList.remove('show'); }

async function openCustomer(id){
  custOverlay.classList.add('show');
  document.getElementById('custModal').innerHTML = '<div class="loadingNote">بيحمّل بيانات العميل...</div>';
  try{
    const d = await crmApi('admin-crm-customer-detail', {customerId:id});
    renderCustomerModal(d.customer, d.quotes, d.interactions);
  }catch(err){ document.getElementById('custModal').innerHTML = '<div class="loadingNote">تعذر التحميل: '+err.message+'</div>'; }
}
function opt(map, current){ return Object.entries(map).map(([k,v])=>`<option value="${k}" ${k===current?'selected':''}>${typeof v==='string'?v:v.label}</option>`).join(''); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function renderCustomerModal(c, quotes, interactions){
  const m = document.getElementById('custModal');
  m.innerHTML = `
    <div class="head">
      <div><h2>${c.name || 'بدون اسم'}</h2><div class="phone">${c.phone}</div></div>
      <button class="closeX" data-close>×</button>
    </div>
    <div class="grid2">
      <div class="field"><label>الاسم</label><input type="text" id="f_name" value="${c.name||''}"></div>
      <div class="field"><label>المدينة</label><input type="text" id="f_city" value="${c.city||''}"></div>
      <div class="field"><label>الحالة</label><select id="f_status">${opt(STATUS_META, c.status)}</select></div>
      <div class="field"><label>الأولوية</label><select id="f_priority">${opt(PRIORITY_META, c.priority)}</select></div>
      <div class="field"><label>رأيه في السعر</label><select id="f_price"><option value="">-- اختر --</option>${opt(PRICE_META, c.price_feedback)}</select></div>
      <div class="field"><label>سبب توقف التنفيذ</label><select id="f_blocker"><option value="">-- اختر --</option>${opt(BLOCKER_META, c.blocker_reason)}</select></div>
      <div class="field"><label>المندوب المسؤول</label><input type="text" id="f_rep" value="${c.assigned_rep||''}"></div>
      <div class="field"><label>موعد المتابعة القادمة</label><input type="date" id="f_followup" value="${c.next_follow_up_date||''}"></div>
    </div>
    <div class="field"><label>ملاحظات عن المشكلة / السبب</label><textarea id="f_notes">${c.blocker_notes||''}</textarea></div>
    <div class="saveBar"><button class="btn" id="saveCustBtn">حفظ بيانات المتابعة</button></div>

    <div class="section">
      <h4>سجل عروض الأسعار (${quotes.length})</h4>
      ${quotes.length ? quotes.map(q=>`
        <div class="quoteRow"><div class="top"><span>${fmtDate(q.created_at)}</span><span>${q.rep_display_name||''}</span></div>
        <div>القدرة: <b>${q.hp||'-'}</b> · الإجمالي: <b class="mono">${fmtMoney(q.final_total)} ﷼</b></div></div>`).join('')
        : '<div class="emptyNote">لسه ملوش عروض مسجلة بالرقم ده</div>'}
    </div>

    <div class="section">
      <h4>سجل المتابعات والتواصل (${interactions.length})</h4>
      <div class="grid2" style="margin-bottom:10px;">
        <div class="field"><label>نوع التواصل</label><select id="i_type">${opt(INTERACTION_META, 'call')}</select></div>
        <div class="field"><label>النتيجة (اختياري)</label><input type="text" id="i_outcome" placeholder="مثال: هيرد بكرة"></div>
      </div>
      <div class="field"><label>ملاحظة</label><textarea id="i_note" placeholder="اكتب اللي حصل في المكالمة/الزيارة..."></textarea></div>
      <div class="saveBar" style="margin-top:0;"><button class="btn ghost" id="addIntBtn">+ إضافة متابعة</button></div>
      <div id="intList" style="margin-top:14px;">
        ${interactions.length ? interactions.map(i=>`
          <div class="intRow"><div class="top"><span>${INTERACTION_META[i.interaction_type]||i.interaction_type} · ${i.rep_username||''}</span><span>${fmtDate(i.created_at)}</span></div>
          ${i.note?`<div class="note">${escapeHtml(i.note)}</div>`:''}
          ${i.outcome?`<div class="note" style="color:var(--muted)">النتيجة: ${escapeHtml(i.outcome)}</div>`:''}</div>`).join('')
          : '<div class="emptyNote">لسه مفيش متابعات مسجلة</div>'}
      </div>
    </div>
  `;
  m.querySelector('[data-close]').addEventListener('click', closeCustomer);
  m.querySelector('#saveCustBtn').addEventListener('click', async ()=>{
    try{
      const fields = {
        name: m.querySelector('#f_name').value.trim(),
        city: m.querySelector('#f_city').value.trim(),
        status: m.querySelector('#f_status').value,
        priority: m.querySelector('#f_priority').value,
        price_feedback: m.querySelector('#f_price').value || null,
        blocker_reason: m.querySelector('#f_blocker').value || null,
        assigned_rep: m.querySelector('#f_rep').value.trim(),
        next_follow_up_date: m.querySelector('#f_followup').value || null,
        blocker_notes: m.querySelector('#f_notes').value.trim(),
      };
      await crmApi('admin-crm-update', {customerId:c.id, fields});
      toast('اتحفظ ✅');
      loadCustomers(); loadDashboard(); openCustomer(c.id);
    }catch(err){ toast('خطأ: '+err.message); }
  });
  m.querySelector('#addIntBtn').addEventListener('click', async ()=>{
    const note = m.querySelector('#i_note').value.trim();
    if(!note){ toast('اكتب ملاحظة الأول'); return; }
    try{
      await crmApi('admin-crm-add-interaction', {
        customerId:c.id, interactionType: m.querySelector('#i_type').value,
        note, outcome: m.querySelector('#i_outcome').value.trim(),
      });
      toast('اتسجلت المتابعة ✅');
      openCustomer(c.id); loadCustomers();
    }catch(err){ toast('خطأ: '+err.message); }
  });
}

/* ============ NEW LEAD ============ */
const newOverlay = document.getElementById('newOverlay');
document.getElementById('newLeadBtn').addEventListener('click', ()=>{
  document.getElementById('newName').value='';
  document.getElementById('newPhone').value='';
  document.getElementById('newCity').value='';
  document.getElementById('newRep').value= SESSION.role==='rep' ? SESSION.displayName : '';
  document.getElementById('newErr').textContent='';
  newOverlay.classList.add('show');
});
document.querySelectorAll('[data-close-new]').forEach(b=>b.addEventListener('click', ()=>newOverlay.classList.remove('show')));
newOverlay.addEventListener('click', (e)=>{ if(e.target===newOverlay) newOverlay.classList.remove('show'); });
document.getElementById('newSaveBtn').addEventListener('click', async ()=>{
  const phone = document.getElementById('newPhone').value.trim();
  const errEl = document.getElementById('newErr');
  if(!phone){ errEl.textContent='رقم الهاتف مطلوب'; return; }
  try{
    await crmApi('admin-crm-create-customer', {
      name: document.getElementById('newName').value.trim(),
      phone, city: document.getElementById('newCity').value.trim(),
      assignedRep: document.getElementById('newRep').value.trim(),
    });
    newOverlay.classList.remove('show');
    toast('اتضاف العميل ✅');
    loadCustomers(); loadDashboard();
  }catch(err){ errEl.textContent = err.message; }
});
</script>
</body>
</html>
